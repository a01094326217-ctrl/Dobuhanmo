<script>
(()=>{
'use strict';
const KEY='seungjun-transfer-planner-v2';
const DAYS=['월','화','수','목','금','토','일'];
const CATS={math:{label:'수학 강의',cls:'math',color:'#8060c7'},english:{label:'영어 강의',cls:'english',color:'#4b8bd3'},vocab:{label:'영단어 루틴',cls:'vocab',color:'#329879'},review:{label:'문법 오답',cls:'review',color:'#c58a3b'},verb:{label:'동사 암기',cls:'verb',color:'#c66c88'},school:{label:'학교 수업',cls:'school',color:'#7185a6'},work:{label:'알바',cls:'work',color:'#d59a48'}};
const DEFAULT_GOALS=[{id:'math',name:'미적분학',target:960,cat:'math'},{id:'english',name:'영어 강의 진도',target:360,cat:'english'},{id:'vocab',name:'영단어 루틴',target:210,cat:'vocab'},{id:'review',name:'문법 오답정리',target:60,cat:'review'},{id:'verb',name:'유도성·금지성 동사',target:30,cat:'verb'}];
let state=null, activeFilter='all';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return iso(d)};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x)};
const dayIndex=s=>(parseDate(s).getDay()+6)%7;
const dateLabel=s=>{const d=parseDate(s);return `${d.getMonth()+1}.${d.getDate()}`};
const timeMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const duration=(a,b)=>{let e=timeMin(b),s=timeMin(a);if(e<=s)e+=1440;return e-s};
const fmtMin=n=>{n=((n%1440)+1440)%1440;return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
const range=(a,b)=>`${a}–${b}`;
const hm=m=>`${Math.floor(m/60)}시간${m%60?` ${m%60}분`:''}`;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));const s=$('#saveState');if(s)s.textContent='자동 저장됨'}
function weekData(){if(!state.weeks[state.weekStart])state.weeks[state.weekStart]={work:[],tasks:[],goals:structuredClone(DEFAULT_GOALS)};const w=state.weeks[state.weekStart];w.work??=[];w.tasks??=[];w.goals??=structuredClone(DEFAULT_GOALS);return w}
function seedEmpty(){return {version:2,weekStart:mondayOf(new Date()),wakeTime:'09:00',school:{},weeks:{}}}
function validConfig(x){return x&&x.version&&x.school&&x.weeks&&x.weekStart}
function getWeekDates(){return Array.from({length:7},(_,i)=>addDays(state.weekStart,i))}
function getSchool(date){return state.school[DAYS[dayIndex(date)]]||[]}
function getTasks(date){return weekData().tasks.filter(t=>t.date===date)}
function getWork(date){return weekData().work.filter(w=>w.date===date)}
function allEvents(date){const out=[];getSchool(date).forEach((x,i)=>out.push({...x,id:`school-${date}-${i}`,cat:'school',startMin:timeMin(x.start),endMin:timeMin(x.end)}));getWork(date).forEach(x=>out.push({...x,cat:'work',startMin:timeMin(x.start),endMin:timeMin(x.end)<=timeMin(x.start)?timeMin(x.end)+1440:timeMin(x.end)}));getTasks(date).filter(t=>t.start&&t.end).forEach(t=>{const off=t.nextDay?1440:0;let e=timeMin(t.end)+off;const a=timeMin(t.start)+off;if(e<=a)e+=1440;out.push({...t,cat:t.cat,startMin:a,endMin:e})});return out.sort((a,b)=>a.startMin-b.startMin)}
function conflicts(date){const ev=allEvents(date).filter(e=>e.cat==='school'||e.cat==='work'||e.cat==='math'||e.cat==='english'||e.cat==='vocab'||e.cat==='review'||e.cat==='verb');const bad=new Set();for(let i=0;i<ev.length;i++)for(let j=i+1;j<ev.length;j++){const a=ev[i],b=ev[j];if(Math.max(a.startMin,b.startMin)<Math.min(a.endMin,b.endMin)){bad.add(a.id);bad.add(b.id)}}return bad}
function freeMinutes(date){const spans=allEvents(date).map(e=>[Math.max(540,e.startMin),Math.min(1500,e.endMin)]).filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]);let used=0,end=540;for(const [a,b] of spans){if(b<=end)continue;used+=b-Math.max(a,end);end=Math.max(end,b)}return Math.max(0,960-used)}
function totals(){const tasks=weekData().tasks;const planned=tasks.reduce((n,t)=>n+(t.duration||0),0);const done=tasks.filter(t=>t.done).reduce((n,t)=>n+(t.duration||0),0);return {planned,done,taskCount:tasks.length,doneCount:tasks.filter(t=>t.done).length}}
function render(){if(!state){renderWelcome();return}const w=weekData(),dates=getWeekDates(),tot=totals();const rangeText=`${dateLabel(dates[0])} – ${dateLabel(dates[6])}`;const plannedByCat={};const doneByCat={};w.tasks.forEach(t=>{plannedByCat[t.cat]=(plannedByCat[t.cat]||0)+(t.duration||0);if(t.done)doneByCat[t.cat]=(doneByCat[t.cat]||0)+(t.duration||0)});
const weeklyProgress=tot.planned?Math.round(tot.done/tot.planned*100):0;
$('#app').innerHTML=`<main class="shell">
<header class="topbar"><div class="brand"><div class="brand-mark">S</div><div class="brand-copy"><small>WEEKLY STUDY SYSTEM</small><strong>편입 공부 플래너</strong></div></div><div class="top-actions"><span class="pill"><i class="live-dot"></i><span id="saveState">브라우저에 저장</span></span><button class="btn" id="printBtn">인쇄</button><button class="btn" id="backupBtn">백업</button><button class="btn primary" id="workBtn">알바 일정 수정</button></div></header>
<section class="hero"><div><div class="eyebrow">TRANSFER STUDY · THIS WEEK</div><h1>이번 주, 계획한 만큼 해내기.</h1><p>수업과 알바를 먼저 고정하고, 남는 시간을 편입 공부에 배치했어.</p></div><div class="week-nav"><button id="prevWeek" aria-label="이전 주">‹</button><div class="week-label"><strong>${rangeText}</strong><small>${state.weekStart} 시작 주간</small></div><button id="nextWeek" aria-label="다음 주">›</button></div></section>
<section class="metrics">
<div class="metric"><div class="metric-top"><span>이번 주 공부 계획</span><i class="metric-icon">◷</i></div><div class="metric-value">${hm(tot.planned)}</div><div class="metric-note">체크 가능한 학습 ${tot.taskCount}개</div></div>
<div class="metric"><div class="metric-top"><span>완료한 공부</span><i class="metric-icon">✓</i></div><div class="metric-value green">${hm(tot.done)}</div><div class="metric-note">${tot.doneCount}개 완료 · ${weeklyProgress}% 달성</div></div>
<div class="metric"><div class="metric-top"><span>수학 · 미적분학</span><i class="metric-icon">∫</i></div><div class="metric-value purple">${hm(doneByCat.math||0)}</div><div class="metric-note">목표 16시간 · 계획 ${hm(plannedByCat.math||0)}</div></div>
<div class="metric"><div class="metric-top"><span>영어 강의</span><i class="metric-icon">A</i></div><div class="metric-value blue">${hm(doneByCat.english||0)}</div><div class="metric-note">목표 6시간 · 계획 ${hm(plannedByCat.english||0)}</div></div>
</section>
<section class="progress-panel"><div class="progress-head"><strong>주간 실행률</strong><span>${tot.doneCount} / ${tot.taskCount}개 완료 · ${weeklyProgress}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${weeklyProgress}%"></div></div><div class="progress-sub"><span>완료한 학습 시간 기준으로 자동 계산</span><span>${hm(tot.planned-tot.done)} 남음</span></div></section>
<div class="layout"><section class="panel"><div class="panel-head"><div><div class="panel-title">주간 시간표</div><div class="panel-sub">학교 · 알바 · 수학 · 영어 · 단어 루틴을 색으로 구분</div></div><button class="btn small soft" id="copyPlanBtn">지난주 계획 복사</button></div><div class="legend">${[['school','학교'],['work','알바'],['math','수학 강의'],['english','영어 강의'],['vocab','영단어 루틴'],['review','오답·복습']].map(([k,n])=>`<span class="legend-item"><i class="dot" style="background:${CATS[k].color}"></i>${n}</span>`).join('')}</div><div class="schedule-grid">${dates.map((date,i)=>renderDay(date,i)).join('')}</div><div class="schedule-foot"><span>기상 목표 ${esc(state.wakeTime||'09:00')} · 시간표는 주 단위로 이동 가능</span><span>겹치는 일정은 빨간 테두리로 표시</span></div></section>
<aside class="panel"><div class="panel-head"><div><div class="panel-title">주간 목표</div><div class="panel-sub">완료 체크 기준으로 진척도 반영</div></div><button class="btn small" id="goalsBtn">목표 편집</button></div><div class="goals">${w.goals.map(g=>{const p=plannedByCat[g.cat]||0,d=doneByCat[g.cat]||0,pc=g.target?Math.min(100,Math.round(d/g.target*100)):0;return `<div class="goal"><div class="goal-head"><span class="goal-name">${esc(g.name)}</span><span class="goal-time">${hm(d)} / ${hm(g.target)}</span></div><div class="mini-track"><div class="mini-fill" style="width:${pc}%;background:${CATS[g.cat]?.color||'#7185a6'}"></div></div><div class="goal-foot">계획 ${hm(p)} · 목표 대비 ${pc}% 완료</div></div>`}).join('')}</div><div class="target-callout"><strong>이번 주 핵심</strong><br>미적분학 3~19강을 최대한 진도 내고, 영어 강의 진도와 매일 단어 루틴을 놓치지 않기.</div></aside></div>
<section class="panel tasks-panel"><div class="panel-head"><div><div class="panel-title">오늘의 체크리스트</div><div class="panel-sub">공부를 끝내면 체크해. 상태는 이 기기에 자동 저장돼.</div></div><div class="task-toolbar"><button class="filter ${activeFilter==='all'?'active':''}" data-filter="all">전체</button><button class="filter ${activeFilter==='todo'?'active':''}" data-filter="todo">미완료</button><button class="filter ${activeFilter==='done'?'active':''}" data-filter="done">완료</button><button class="btn small" id="addTaskBtn">+ 할 일 추가</button></div></div><div class="task-days">${dates.map(date=>renderTasks(date)).join('')}</div></section>
<div class="bottom-grid"><section class="quick-card"><h3>이번 주 학습 배분</h3><div class="quick-list">${[['미적분학','15시간 배정 / 16시간 목표'],['영어 강의','6시간 배정 / 3강까지 진도'],['영단어 루틴','매일 30분 · 7일'],['문법 오답','수요일 절반 + 금요일 마무리'],['동사 암기','영어 강의 1회차 후 복습']].map(([a,b])=>`<div class="quick-row"><span>${a}</span><strong>${b}</strong></div>`).join('')}</div></section><section class="quick-card"><h3>알바 일정 요약</h3><div class="quick-list">${renderWorkSummary()}</div><div class="save-hint"><span>●</span><span>일정과 체크 상태는 <b>이 브라우저 안에만</b> 저장돼. 백업 파일로 옮길 수 있어.</span></div></section></div>
<div class="footer">개인 일정은 서버로 전송되지 않아. 브라우저 저장공간에 보관되고, 백업 파일로 내보내거나 가져올 수 있어.</div>
</main>`;
bind();}
function renderDay(date,i){const today=iso(new Date())===date,ev=allEvents(date),bad=conflicts(date),hasConflict=bad.size>0;return `<article class="day ${today?'today':''}"><div class="day-head"><strong>${DAYS[i]}요일 ${today?'<span class="today-tag">오늘</span>':''}</strong><small>${dateLabel(date)}</small></div>${ev.length?ev.map(e=>{const cat=e.cat,conf=bad.has(e.id),time=e.nextDay?`익일 ${e.start}–${fmtMin(e.endMin)}`:`${e.start}–${fmtMin(e.endMin)}${e.endMin>=1440?' (익일)':''}`;return `<div class="event ${CATS[cat]?.cls||''} ${conf?'conflict':''}" title="${esc(e.title||e.label)}"><div class="event-time">${time}</div><div class="event-name">${esc(e.title||e.label||CATS[cat]?.label||'일정')}</div></div>`}).join(''):'<div class="event empty">등록된 일정 없음</div>'}${hasConflict?'<div class="conflict-note">일정 겹침 확인</div>':''}<div class="day-free" title="09:00~다음 날 01:00 중 수업·알바·예정된 공부를 제외한 시간. 식사와 휴식 시간도 포함돼.">미배정 시간 <b>${hm(freeMinutes(date))}</b></div></article>`}
function renderTasks(date){const i=dayIndex(date),list=getTasks(date).filter(t=>activeFilter==='all'||(activeFilter==='todo'?!t.done:t.done));const done=getTasks(date).filter(t=>t.done).length;return `<section class="task-day"><div class="task-day-head"><strong>${DAYS[i]}요일 · ${dateLabel(date)}</strong><span>${done}/${getTasks(date).length} 완료</span></div>${list.length?list.map(t=>`<label class="task ${t.done?'done':''}"><input type="checkbox" data-task="${esc(t.id)}" ${t.done?'checked':''}><span class="task-body"><span class="task-title">${esc(t.title)}${t.floating?'<span class="floating-note">시간 자유</span>':''}</span><span class="task-meta">${esc(t.note||CATS[t.cat]?.label||'학습')} · ${t.duration?hm(t.duration):'시간 미정'}</span></span>${t.start?`<span class="task-time">${t.nextDay?'익일 ':''}${range(t.start,t.end)}${!t.nextDay&&timeMin(t.end)<=timeMin(t.start)?' +1일':''}</span>`:''}</label>`).join(''):'<div class="task-empty">표시할 할 일이 없어.</div>'}</section>`}
function renderWorkSummary(){const w=weekData(),dates=getWeekDates();const list=w.work.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));if(!list.length)return '<div class="quick-row"><span>등록된 알바 없음</span><strong>알바 일정 수정에서 추가</strong></div>';return list.map(x=>`<div class="quick-row"><span>${DAYS[dayIndex(x.date)]} ${dateLabel(x.date)}</span><strong>${range(x.start,x.end)}</strong></div>`).join('')}
function renderWelcome(){ $('#app').innerHTML=`<main class="shell"><div class="welcome"><div class="welcome-mark">S</div><div class="eyebrow">STUDY PLANNER</div><h1>네 공부 리듬을 한눈에 관리해.</h1><p>초기 설정 파일을 가져오면 학교 수업, 이번 주 알바, 공부 블록과 체크리스트가 자동으로 세팅돼. 개인 일정은 이 브라우저 안에만 저장돼.</p><button class="btn primary" id="welcomeImport">초기 일정 불러오기</button><p style="margin-top:16px;font-size:11px">아직 설정 파일이 없다면, 대화에서 받은 <b>편입플래너_초기설정.json</b>을 선택해.</p></div></main>`;$('#welcomeImport').onclick=()=>$('#importFile').click()}
function bind(){
$('#prevWeek').onclick=()=>changeWeek(-7);$('#nextWeek').onclick=()=>changeWeek(7);$('#workBtn').onclick=openWorkModal;$('#printBtn').onclick=()=>window.print();$('#backupBtn').onclick=exportData;$('#copyPlanBtn').onclick=copyPreviousPlan;$('#goalsBtn').onclick=openGoalsModal;$('#addTaskBtn').onclick=openTaskModal;
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;render()});document.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{const t=weekData().tasks.find(x=>x.id===c.dataset.task);if(t){t.done=c.checked;save();render()}});
}
function changeWeek(n){const d=parseDate(state.weekStart);d.setDate(d.getDate()+n);state.weekStart=iso(d);save();render()}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalContent').innerHTML=html;$('#modalBackdrop').classList.add('open')}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
$('#closeModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function openWorkModal(){
  const w=weekData(),dates=getWeekDates();
  const list=w.work.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
  openModal('이번 주 알바 일정 수정',`<form id="workForm"><div class="form-grid"><div class="field full"><label>근무 날짜</label><select id="workDate">${dates.map((d,i)=>`<option value="${d}">${DAYS[i]}요일 ${dateLabel(d)}</option>`).join('')}</select></div><div class="field"><label>시작</label><input id="workStart" type="time" value="17:00" required></div><div class="field"><label>종료</label><input id="workEnd" type="time" value="23:00" required></div><div class="field full"><label>일정 이름</label><input id="workLabel" value="알바" maxlength="24"></div></div><div class="modal-actions"><button type="button" class="btn" id="cancelWork">닫기</button><button class="btn primary" id="saveWork">알바 일정 추가</button></div></form><div class="shift-list">${list.length?list.map(x=>`<div class="shift-row"><span><b>${DAYS[dayIndex(x.date)]} ${dateLabel(x.date)}</b> · ${range(x.start,x.end)}</span><span><button type="button" data-edit-work="${esc(x.id)}">수정</button> <button type="button" data-remove-work="${esc(x.id)}">삭제</button></span></div>`).join(''):'<div class="task-empty">이번 주 알바 일정을 추가해.</div>'}</div>`);
  let editId=null;
  $('#cancelWork').onclick=closeModal;
  $('#workForm').onsubmit=e=>{e.preventDefault();const date=$('#workDate').value,start=$('#workStart').value,end=$('#workEnd').value,label=$('#workLabel').value.trim()||'알바';if(!date||!start||!end||duration(start,end)<=0)return toast('근무 시간을 확인해줘.');if(editId){const current=weekData().work.find(x=>x.id===editId);if(current)Object.assign(current,{date,start,end,label})}else{weekData().work.push({id:crypto.randomUUID(),date,start,end,label})}save();closeModal();render();toast('알바 일정이 저장됐어.')};
  document.querySelectorAll('[data-edit-work]').forEach(b=>b.onclick=()=>{const x=weekData().work.find(v=>v.id===b.dataset.editWork);if(!x)return;editId=x.id;$('#workDate').value=x.date;$('#workStart').value=x.start;$('#workEnd').value=x.end;$('#workLabel').value=x.label||'알바';$('#saveWork').textContent='수정 내용 저장';$('#workForm').scrollIntoView({behavior:'smooth',block:'start'})});
  document.querySelectorAll('[data-remove-work]').forEach(b=>b.onclick=()=>{weekData().work=weekData().work.filter(x=>x.id!==b.dataset.removeWork);save();openWorkModal()});
}
function renderBehindModal(){} // modal refresh is handled by reopening after changes.
function openTaskModal(){const dates=getWeekDates();openModal('공부 할 일 추가',`<form id="taskForm"><div class="form-grid"><div class="field full"><label>날짜</label><select id="taskDate">${dates.map((d,i)=>`<option value="${d}">${DAYS[i]}요일 ${dateLabel(d)}</option>`).join('')}</select></div><div class="field full"><label>과목</label><select id="taskCat">${['math','english','vocab','review','verb'].map(k=>`<option value="${k}">${CATS[k].label}</option>`).join('')}</select></div><div class="field full"><label>할 일</label><input id="taskTitle" maxlength="80" placeholder="예: 미적분학 3강 복습" required></div><div class="field"><label>시작 시간 (선택)</label><input id="taskStart" type="time"></div><div class="field"><label>종료 시간 (선택)</label><input id="taskEnd" type="time"></div><div class="field full"><label>예상 소요 시간 (분)</label><input id="taskDuration" type="number" min="0" step="5" value="30"></div><div class="field full"><label>메모 (선택)</label><input id="taskNote" maxlength="100" placeholder="공부 범위 또는 참고 사항"></div></div><div class="modal-actions"><button type="button" class="btn" id="cancelTask">취소</button><button class="btn primary">체크리스트에 추가</button></div></form>`);$('#cancelTask').onclick=closeModal;$('#taskForm').onsubmit=e=>{e.preventDefault();const start=$('#taskStart').value,end=$('#taskEnd').value;if((start&&!end)||(!start&&end))return toast('시작과 종료 시간을 둘 다 입력하거나 비워둬.');const t={id:crypto.randomUUID(),date:$('#taskDate').value,cat:$('#taskCat').value,title:$('#taskTitle').value.trim(),start:start||null,end:end||null,duration:Number($('#taskDuration').value)||0,note:$('#taskNote').value.trim(),done:false,floating:!start};weekData().tasks.push(t);save();closeModal();render();toast('할 일을 추가했어.')}}
function openGoalsModal(){const goals=weekData().goals;openModal('주간 목표 편집',`<form id="goalsForm">${goals.map(g=>`<div class="field" style="margin:10px 0"><label>${esc(g.name)} · 목표 시간 (분)</label><input type="number" min="0" step="30" data-goal="${esc(g.id)}" value="${g.target}"></div>`).join('')}<div class="modal-actions"><button type="button" class="btn" id="cancelGoals">취소</button><button class="btn primary">목표 저장</button></div></form>`);$('#cancelGoals').onclick=closeModal;$('#goalsForm').onsubmit=e=>{e.preventDefault();document.querySelectorAll('[data-goal]').forEach(el=>{const g=weekData().goals.find(x=>x.id===el.dataset.goal);if(g)g.target=Number(el.value)||0});save();closeModal();render();toast('목표 시간을 저장했어.')}}
function copyPreviousPlan(){const prev=addDays(state.weekStart,-7),src=state.weeks[prev];if(!src||!src.tasks.length){toast('복사할 이전 주 계획이 없어.');return}if(!confirm('지난주 공부 계획을 이번 주로 복사할까? 완료 체크는 초기화돼. 알바 일정은 복사하지 않아.'))return;const shift=7;weekData().tasks=src.tasks.map(t=>({...t,id:crypto.randomUUID(),date:addDays(t.date,shift),done:false}));weekData().goals=structuredClone(src.goals||DEFAULT_GOALS);save();render();toast('지난주 공부 계획을 복사했어.')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});download(blob,`study-planner-backup-${state.weekStart}.json`);toast('백업 파일을 만들었어.')}
function download(blob,name){const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!validConfig(x))throw new Error('형식이 맞지 않아');state=x;state.weeks??={};state.school??={};state.weekStart=mondayOf(parseDate(state.weekStart));save();render();toast('설정 파일을 불러왔어.')}catch(err){toast('JSON 파일을 읽지 못했어. 초기 설정 파일인지 확인해줘.')}e.target.value=''};r.readAsText(f)}
function toast(msg){const n=$('#notice');n.textContent=msg;n.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove('show'),2600)}
function init(){state=load();if(!state){renderWelcome()}else{state.weekStart=state.weekStart||mondayOf(new Date());state.weeks??={};state.school??={};render()}$('#importFile').addEventListener('change',importData)}
init();
})();
</script>
</body>
</html>
